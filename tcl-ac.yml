esphome:
  name: tcl-ac-controller
  friendly_name: "TCL Air Conditioner"

esp32:
  board: esp32dev
  framework:
    type: arduino

# 1️⃣ استدعاء المكون الخارجي مباشرة من GitHub
external_components:
  - source: github://lNikazzzl/tcl_ac_esphome
    components: [ tcl_ac ]

# 2️⃣ إعداد منفذ السيريال UART (أطراف TX=17 و RX=16)
uart:
  - id: uart_ac
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1

# 3️⃣ إضافة واجهة التحكم بالمكيف في Home Assistant
climate:
  - platform: tcl_ac
    name: "TCL AC"
    uart_id: uart_ac
    supports_cool: true
    supports_heat: true
    supports_fan_only: true
    supports_dry: true
    supports_auto: true
    
